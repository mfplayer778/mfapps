<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>必要経験値一覧</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#1e1e2f;color:#fff;margin:0;padding:16px}
h1,h2{text-align:center;margin:10px 0 14px}
.panel{background:#2b2b44;padding:12px;border-radius:8px;margin-bottom:12px}

/* 表 */
.table-wrap{max-height:560px;overflow:auto;border-radius:6px}
table{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;font-size:14px}
th,td{border-right:1px solid #555;border-bottom:1px solid #555;padding:6px;text-align:center;white-space:nowrap}
th:first-child,td:first-child{border-left:1px solid #555}
thead th{position:sticky;top:0;z-index:100;background:#3a3a5a;background-clip:padding-box}
thead tr:nth-child(1) th{height:40px}
thead tr:nth-child(2) th{top:40px;height:32px;z-index:99}
.reinc-group input{height:26px;padding:0 6px;margin:0 3px;vertical-align:middle}

input{background:#1e1e2f;color:#66ccff;border:1px solid #66ccff;border-radius:4px;padding:4px 6px;text-align:center;width:70px}
.reinc-group,.reinc-input,.adjusted-header,.adjusted-value{color:#66ccff!important}
tr.first-over td{background:#1c1c2e;color:#ffd166!important;font-weight:bold}
.reinc-group{font-weight:bold}

/* 範囲計算 */
.range-result{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-size:18px;font-weight:700;line-height:1.8;min-height:40px}
.range-result .range-input{width:72px;padding:6px 8px;border:1px solid #666;border-radius:6px;background:#1e1e2f;color:#fff;text-align:center;font-size:17px;font-weight:700}
.range-result .range-input:focus{outline:2px solid #66ccff;outline-offset:1px}
#rangeExpLabel{color:#66ccff;font-size:20px}
.range-error{text-align:center;color:#ff8080;min-height:24px}

@media(max-width:480px){
  body{padding:8px}
  h1{font-size:22px}
  h2{font-size:16px;line-height:1.5}
  .panel{padding:8px}
  .table-wrap{max-height:70vh;max-height:70dvh}
  table{min-width:0;font-size:12px}
  th,td{padding:4px 2px}
  thead th{white-space:normal;line-height:1.2;font-size:11px;padding:2px}
  thead th[rowspan]{white-space:nowrap}
  thead th.reinc-group{white-space:nowrap;font-size:12px!important}
  .nb{display:inline-block}
  input{font-size:16px;width:62px}
  .range-result{font-size:15px;gap:4px}
  .range-result .range-input{width:64px;font-size:16px;padding:6px 4px}
  #rangeExpLabel{font-size:18px}
}
</style>
</head>
<body>

<h1>必要経験値一覧表</h1>

<div class="panel">
<div class="table-wrap">
<table id="expTable">
<thead>
<tr>
  <th rowspan="2">レベル</th>
  <th rowspan="2">必要経験値</th>
  <th rowspan="2">累計経験値</th>
  <th colspan="2" class="reinc-group">
    転生<input id="reincarnation" class="reinc-input" type="number" min="0" step="1" value="0" aria-label="転生回数">回目
  </th>
</tr>
<tr>
<th class="adjusted-header"><span class="nb">補正後</span><span class="nb">必要経験値</span></th>
<th class="adjusted-header"><span class="nb">補正後</span><span class="nb">累計経験値</span></th></tr>
</thead>
<tbody id="expTableBody"></tbody>
</table>
</div>
</div>

<div class="panel">
<h2>転生<span id="rangeReincNumber">0</span>回の時レベルアップに必要な経験値</h2>

const MAX_LEVEL=800;

function formatExp(value){
 const n=Math.max(1,Math.floor(value));
 const units=[
  {threshold:1e18,divisor:1e18,suffix:"E"},
  {threshold:1e15,divisor:1e15,suffix:"P"},
  {threshold:1e12,divisor:1e12,suffix:"T"},
  {threshold:1e9,divisor:1e9,suffix:"G"},
  {threshold:1e6,divisor:1e6,suffix:"M"},
  {threshold:1e4,divisor:1e3,suffix:"k"}
 ];
 for(const u of units){
   if(n>=u.threshold) return Math.floor(n/u.divisor)+u.suffix;
 }
 return n.toLocaleString("ja-JP");
}
function getReincarnation(){
 const input=document.getElementById("reincarnation");
 let n=parseInt(input.value,10);
 if(!Number.isFinite(n)||n<0)n=0;
 return n;
}
const EXP_LIMIT=2000000000;

function renderTable(){
 const r=getReincarnation();
 document.getElementById("rangeReincNumber").textContent=r;

 const tbody=document.getElementById("expTableBody");
 let cumulative=0;
 let adjustedCumulative=0;

 tbody.innerHTML=EXP_DATA.map(row=>{
   const required=Math.max(1,Math.floor(row.raw));
   const adjusted=Math.max(1,Math.floor(row.raw/(r+1)));
   const prevAdjusted=adjustedCumulative;
   cumulative+=required;
   adjustedCumulative+=adjusted;
   const firstOver=prevAdjusted<=EXP_LIMIT&&adjustedCumulative>EXP_LIMIT;

   return `<tr${firstOver?' class="first-over"':''}>
     <td>${row.level.toLocaleString("ja-JP")}</td>
     <td>${formatExp(required)}</td>
     <td>${formatExp(cumulative)}</td>
     <td class="adjusted-value">${formatExp(adjusted)}</td>
     <td class="adjusted-value">${formatExp(adjustedCumulative)}</td>
   </tr>`;
 }).join("");

 calculateRange();
}

// 「A→B」は Lv A ～ Lv(B-1) の必要経験値の合計(1→2 は Lv1 の必要経験値)
function calculateRange(){
 const label=document.getElementById("rangeExpLabel");
 const err=document.getElementById("rangeError");

 const from=parseInt(document.getElementById("rangeFrom").value,10);
 const to=parseInt(document.getElementById("rangeTo").value,10);

 if(!Number.isFinite(from)||!Number.isFinite(to)){
   label.textContent="-";
   err.textContent="";
   return;
 }
 if(from<1||to>MAX_LEVEL||to<=from){
   label.textContent="-";
   err.textContent=`開始レベルは1以上、終了レベルは開始レベルより大きく${MAX_LEVEL}以下にしてください`;
   return;
 }

 const divisor=getReincarnation()+1;
 let total=0;
 for(const row of EXP_DATA){
   if(row.level>=from&&row.level<to){
     total+=Math.max(1,Math.floor(row.raw/divisor));
   }
 }

 err.textContent="";
label.textContent=total.toLocaleString("ja-JP");
}

// 入力欄を離れたときに範囲内へ補正(入力中は書き換えない)
function clampInputs(){
 const f=document.getElementById("rangeFrom");
 const t=document.getElementById("rangeTo");
 let from=parseInt(f.value,10);
 let to=parseInt(t.value,10);
 if(Number.isFinite(from))f.value=Math.max(1,Math.min(MAX_LEVEL-1,from));
 if(Number.isFinite(to))t.value=Math.max(2,Math.min(MAX_LEVEL,to));
 calculateRange();
}

document.getElementById("reincarnation").addEventListener("input",renderTable);
document.getElementById("reincarnation").addEventListener("change",()=>{
 document.getElementById("reincarnation").value=getReincarnation();
});
["rangeFrom","rangeTo"].forEach(id=>{
 const el=document.getElementById(id);
 el.addEventListener("input",calculateRange);
 el.addEventListener("change",clampInputs);
});


renderTable();
